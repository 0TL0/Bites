<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🌌 BITES - Recepten</title>
<style>
:root{--bg:#050714;--card:rgba(15,23,42,.75);--txt:#f0fff9;--grijs:#94b8b0;--groen:#0f9;--blauw:#0cf;--goud:#fd0;--rand:rgba(0,255,157,.25)}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:radial-gradient(ellipse at top left,rgba(0,60,120,.4) 0,transparent 55%),radial-gradient(ellipse at top right,rgba(0,80,100,.35) 0,transparent 55%),radial-gradient(ellipse at bottom center,rgba(20,40,80,.5) 0,transparent 65%),linear-gradient(180deg,#050714 0,#0a1229 45%,#0f1a3c 100%);color:var(--txt);font-family:Segoe UI,sans-serif;background-attachment:fixed}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(1px 1px at 20px 30px,#fff,transparent),radial-gradient(1.5px 1.5px at 140px 90px,rgba(255,255,255,.9),transparent);background-size:200px 200px;opacity:.4}
.container{position:relative;z-index:1;width:min(96vw,1300px);margin:0 auto;padding:1.2rem}
header{background:rgba(8,12,28,.7);backdrop-filter:blur(20px);border:1px solid var(--rand);border-radius:20px;padding:1.2rem 1.5rem;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.8rem;margin-bottom:1.2rem;position:sticky;top:.8rem;z-index:100}
.logo{font-size:1.6rem;font-weight:800;background:linear-gradient(90deg,var(--groen),var(--blauw));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px}
.acties{display:flex;gap:.6rem;align-items:center}
.btn{background:linear-gradient(135deg,rgba(0,255,157,.15),rgba(0,204,255,.12));color:var(--groen);border:1px solid var(--rand);padding:.6rem 1.1rem;border-radius:10px;cursor:pointer;font-weight:600;transition:all .25s}
.btn:hover{transform:translateY(-3px);border-color:var(--groen);box-shadow:0 0 6px var(--groen),0 0 15px rgba(0,255,157,.4)}
.btn.prim{background:linear-gradient(135deg,#0a6,#088);color:#fff;border:none}
.btn.sec{background:rgba(40,50,80,.4);color:var(--grijs);border-color:rgba(100,120,150,.3)}
.btn.sec:hover{color:var(--blauw);border-color:var(--blauw);box-shadow:0 0 6px var(--blauw),0 0 15px rgba(0,204,255,.3)}
.veld-bar{background:rgba(12,20,45,.65);backdrop-filter:blur(18px);border:1px solid var(--rand);border-radius:20px;padding:1.2rem 1.5rem;margin-bottom:1.2rem}
.rij{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:.6rem}
input,select{background:rgba(10,18,40,.7);border:1px solid rgba(0,255,157,.15);color:var(--txt);padding:.7rem 1rem;border-radius:10px;font-size:.95rem;outline:none;flex:1;min-width:140px}
input:focus,select:focus{border-color:var(--groen);box-shadow:0 0 0 3px rgba(0,255,157,.12)}
.uitklap{display:none;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.6rem;margin-top:.6rem}
.uitklap.aan{display:grid;animation:binnen .3s ease-out}
@keyframes binnen{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.rooster{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:1.2rem}
.kaart{background:var(--card);backdrop-filter:blur(16px);border:1px solid var(--rand);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;transition:all .3s;cursor:pointer}
.kaart:hover{transform:translateY(-6px);border-color:var(--groen);box-shadow:0 0 12px rgba(0,255,157,.15),0 15px 35px rgba(0,0,0,.45)}
.foto{height:150px;background:linear-gradient(135deg,rgba(0,60,80,.4),rgba(0,40,70,.5));display:flex;align-items:center;justify-content:center;font-size:3.5rem;position:relative}
.labels{position:absolute;top:10px;left:10px;display:flex;gap:.3rem;flex-wrap:wrap}
.label{background:rgba(5,10,30,.75);padding:.25rem .5rem;border-radius:6px;font-size:.7rem;color:var(--groen);border:1px solid rgba(0,255,157,.3)}
.status{position:absolute;top:10px;right:10px;padding:.25rem .5rem;border-radius:6px;font-size:.7rem;font-weight:600;backdrop-filter:blur(8px)}
.status.ja{background:rgba(0,255,157,.12);color:var(--groen);border:1px solid rgba(0,255,157,.4)}
.status.nee{background:rgba(255,215,0,.1);color:var(--goud);border:1px solid rgba(255,215,0,.35)}
.inhoud{padding:1rem;display:flex;flex-direction:column;gap:.5rem}
.titel{font-size:1.05rem;font-weight:700;color:var(--txt)}
.ster{color:var(--goud);letter-spacing:1px}
.ster .leeg{color:rgba(100,90,40,.35)}
.beschrijving{font-size:.85rem;color:var(--grijs)}
.gerei{background:rgba(0,255,157,.08);padding:.45rem .7rem;border-radius:8px;font-size:.8rem;color:var(--groen);border:1px solid rgba(0,255,157,.12);margin-top:.25rem}
.info{display:flex;justify-content:space-between;align-items:center;margin-top:.5rem;padding-top:.6rem;font-size:.8rem;color:var(--grijs);border-top:1px solid rgba(0,255,157,.1)}
.venster{display:none;position:fixed;inset:0;background:rgba(5,7,20,.85);backdrop-filter:blur(12px);align-items:center;justify-content:center;z-index:1000;padding:1rem}
.venster.aan{display:flex}
.venster-inhoud{background:rgba(12,20,45,.92);border:1px solid var(--rand);width:min(100%,600px);max-height:90vh;border-radius:20px;display:flex;flex-direction:column}
.venster-kop{padding:1rem 1.3rem;background:rgba(5,10,30,.6);display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--rand)}
.venster-kop h3{color:var(--groen)}
.venster-body{padding:1.3rem;overflow-y:auto;display:flex;flex-direction:column;gap:.9rem}
.sluit{background:none;border:none;color:var(--grijs);font-size:1.6rem;cursor:pointer}
.sluit:hover{color:var(--groen)}
.groep{display:flex;flex-direction:column;gap:.4rem}
.groep label{font-size:.85rem;color:var(--grijs);font-weight:600}
textarea{resize:vertical;min-height:90px}
.sterren{display:flex;gap:.2rem;font-size:1.6rem;cursor:pointer}
.sterren span{color:rgba(100,90,40,.35);transition:all .2s}
.sterren span.aan{color:var(--goud);text-shadow:0 0 4px rgba(255,215,0,.4)}
.sterren span:hover{transform:scale(1.15)}
.voorver{width:90px;height:90px;background:rgba(10,18,40,.6);border:1px dashed rgba(0,255,157,.25);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:2rem;overflow:hidden}
.voorver img{width:100%;height:100%;object-fit:cover}
.rij2{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.knop-rij{display:flex;gap:.6rem}
.knop-rij .btn{flex:1}
.balkje{font-size:.75rem;color:var(--groen);background:rgba(0,255,157,.1);padding:.25rem .5rem;border-radius:6px;border:1px solid rgba(0,255,157,.25)}
@media(max-width:650px){.rij2{grid-template-columns:1fr}.rooster{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
<header>
<div class="logo">🌌 BITES</div>
<div class="acties">
<span class="balkje" id="beheer" style="display:none">🔐 Beheerder</span>
<button class="btn sec" id="beheerknop" onclick="loginVenster()">🔐</button>
<button class="btn prim" id="toevoegknop" onclick="openForm()" style="display:none">➕ Recept</button>
</div>
</header>

<div class="veld-bar">
<div class="rij">
<input type="text" id="zoek" placeholder="🔍 Zoek op naam, ingrediënt..." oninput="toonAlles()">
<button class="btn" onclick="wisselFilter()">⚙️ Filters</button>
</div>
<div id="filterVak" class="uitklap">
<select id="cat" onchange="toonAlles()">
<option value="">Alle Categorieën</option>
<option>Voorgerecht</option><option selected>Hoofdgerecht</option><option>Bijgerecht</option><option>Nagerecht</option>
<option>Soep</option><option>Salade</option><option>Pasta & Rijst</option><option>Vleesgerecht</option><option>Visgerecht</option>
<option>Vegetarisch</option><option>Vegan</option><option>Tussendoortje</option><option>Drank</option>
</select>
<select id="keuken" onchange="toonAlles()">
<option value="">Alle Keukens</option>
<option>Italiaans</option><option>Mexicaans</option><option>Spaans</option><option>Aziatisch</option><option>Frans</option><option>Nederlands</option><option selected>Overig</option>
</select>
<select id="snel" onchange="toonAlles()">
<option value="">Alle tijden</option>
<option>Snel klaar</option><option>Gezond</option>
</select>
<select id="status" onchange="toonAlles()">
<option value="">Alle status</option>
<option>✅ Uitgeprobeerd</option><option>⏳ Nog proberen</option>
</select>
<select id="sorteer" onchange="toonAlles()">
<option value="tijd-ops">⏱️ Tijd: Kort → Lang</option>
<option value="tijd-afl">⏱️ Tijd: Lang → Kort</option>
<option value="ster-afl">⭐ Beoordeling</option>
<option value="naam">📫 Naam A-Z</option>
</select>
</div>
</div>

<div id="rooster" class="rooster"></div>
</div>

<!-- Inlogvenster -->
<div id="loginV" class="venster">
<div class="venster-inhoud">
<div class="venster-kop"><h3>🔐 Inloggen</h3><button class="sluit" onclick="sluitV('loginV')">&times;</button></div>
<div class="venster-body">
<div class="groep"><label>Wachtwoord</label><input type="password" id="ww"></div>
<div class="knop-rij"><button class="btn prim" onclick="controleerWW()">Inloggen</button><button class="btn sec" onclick="sluitV('loginV')">Annuleren</button></div>
</div>
</div>
</div>

<!-- Recept bekijken -->
<div id="detailV" class="venster">
<div class="venster-inhoud">

<div class="venster-body" id="detailInhoud"></div>
</div>
</div>
</div>

{id:1,naam:"Garnalen in knoflook",cat:"Voorgerecht",keuken:"Spaans",tijd:20,pers:2,ster:4.5,status:"✅ Uitgeprobeerd",foto:"🍤",ing:["400 gr garnalen","Knoflook","Olijfolie","Peterselie","Chili vlokken","Zout"],gerei:["Koekenpan","Lepel"],korte:"Heerlijke Spaanse tapas! In 20 minuten klaar.",stap:"1. Pel de garnalen en dep droog.\n2. Snijd knoflook in plakjes.\n3. Verhit olie en fruit knoflook met chili.\n4. Voeg garnalen toe en bak 2-3 minuten.\n5. Bestrooi met peterselie en zout. Serveer direct."},
{id:2,naam:"Beef Teriyaki",cat:"Hoofdgerecht",keuken:"Aziatisch",tijd:30,pers:2,ster:0,status:"⏳ Nog proberen",foto:"🥩",ing:["400 gr rundvlees","3 el sojasaus","2 el mirin of rijstwijn","1 el suiker of honing","1 teentje knoflook","1 tl gember","1 el sesamolie","Lente-ui"],gerei:["Pan of wok","Lepel"],korte:"Zoete en hartige Japanse stijl.",stap:"1. Snij vlees in dunne reepjes.\n2. Meng sojasaus, mirin, suiker, knoflook en gember.\n3. Marineer vlees 10 minuten.\n4. Verhit olie en bak vlees 4-5 minuten.\n5. Voeg saus toe en laat 2-3 minuten inkoken.\n6. Garneer met lente-ui en sesamzaad."},
{id:3,naam:"Spaghetti Bolognese",cat:"Hoofdgerecht",keuken:"Italiaans",tijd:45,pers:4,ster:4,status:"✅ Uitgeprobeerd",foto:"🍝",ing:["Spaghetti","Gehakt","Tomaat","Ui","Knoflook","Wortel","Selderij"],gerei:["Kookpan","Pan","Mes"],korte:"Klassieke Italiaanse bolognese saus.",stap:"1. Kook de spaghetti gaar.\n2. Snijd ui, knoflook, wortel en selderij fijn.\n3. Fruit de groenten in een pan.\n4. Voeg gehakt toe en bak rul.\n5. Voeg tomaten toe en laat 30 minuten pruttelen.\n6. Meng met de pasta."},

{id:7,naam:"Gebakken kipfilet met tacokruiden en friet",cat:"Hoofdgerecht",keuken:"Mexicaans",tijd:30,pers:2,ster:0,status:"⏳ Nog proberen",foto:"🍗",ing:["Kipfilet","Tacokruiden","Friet","Olie"],gerei:["Pan","Oven/friteuse"],korte:"Kip met pittige kruiden.",stap:"1. Smeer kipfilet in met tacokruiden.\n2. Verhit olie en bak kip gaar.\n3. Bak de friet."},
{id:8,naam:"Kapsalon",cat:"Hoofdgerecht",keuken:"Overig",tijd:35,pers:2,ster:0,status:"⏳ Nog proberen",foto:"🥗",ing:["Shoarma-vlees","Friet","Kaas","Sla","Komkommer","Tomaat","Knoflooksaus"],gerei:["Ovenschaal","Oven"],korte:"Bekende schotel met vlees en groente.",stap:"1. Leg friet op de schaal.\n2. Daarop het vlees.\n3. Bestrooi met kaas en smelt in oven.\n4. Beleg met sla, komkommer en tomaat.\n5. Giet er saus overheen."},
{id:9,naam:"Taco's gehakt",cat:"Hoofdgerecht",keuken:"Mexicaans",tijd:30,pers:3,ster:0,status:"⏳ Nog proberen",foto:"🌮",ing:["Taco schelpen","Gehakt","Tacokruiden","Sla","Tomaat","Kaas","Zure room"],gerei:["Pan"],korte:"Pittige taco's met gehakt.",stap:"1. Bak gehakt rul met tacokruiden.\n2. Verwarm de schelpen.\n3. Vul met gehakt en beleg met groente en kaas."},
{id:10,naam:"Taco's kip",cat:"Hoofdgerecht",keuken:"Mexicaans",tijd:30,pers:3,ster:0,status:"⏳ Nog proberen",foto:"🌮",ing:["Taco schelpen","Kipfilet","Tacokruiden","Sla","Tomaat","Kaas"],gerei:["Pan"],korte:"Taco's met kip in plaats van gehakt.",stap:"1. Snij kip in stukjes en bak met kruiden.\n2. Verwarm de schelpen.\n3. Vul en beleg met groente."},
{id:11,naam:"Nacho Bowl",cat:"Voorgerecht",keuken:"Mexicaans",tijd:20,pers:2,ster:0,status:"⏳ Nog proberen",foto:"🫕",ing:["Nacho chips","Kaas","Gehakt of kip","Guacamole","Zure room","Salsa"],gerei:["Ovenschaal"],korte:"Compleet gevulde nacho schaal.",stap:"1. Leg chips op schaal.\n2. Daarop vlees en kaas.\n3. Smelt in oven.\n4. Voeg saus en guacamole toe."},
{id:12,naam:"Kip Pizza",cat:"Hoofdgerecht",keuken:"Italiaans",tijd:40,pers:4,ster:0,status:"⏳ Nog proberen",foto:"🍕",ing:["Pizzadeeg","Tomatensaus","Kaas","Kipfilet","Groente naar keuze"],gerei:["Oven","Bakplaat"],korte:"Pizza met kip belegd.",stap:"1. Rol deeg uit en beleg met saus.\n2. Voeg kip en groente toe.\n3. Bestrooi met kaas.\n4. Bak in oven volgens deeg-instructies."},

{id:14,naam:"Gehakt Pizza",cat:"Hoofdgerecht",keuken:"Italiaans",tijd:40,pers:4,ster:0,status:"⏳ Nog proberen",foto:"🍕",ing:["Pizzadeeg","Tomatensaus","Kaas","Gehakt","Ui"],gerei:["Oven","Bakplaat"],korte:"Pizza met gehakt belegd.",stap:"1. Rol deeg uit.\n2. Saus, gebakken gehakt en ui erop.\n3. Kaas erover en bakken."},
{id:15,naam:"Ham Pizza",cat:"Hoofdgerecht",keuken:"Italiaans",tijd:40,pers:4,ster:0,status:"⏳ Nog proberen",foto:"🍕",ing:["Pizzadeeg","Tomatensaus","Kaas","Ham"],gerei:["Oven","Bakplaat"],korte:"Simpele pizza met ham.",stap:"1. Deeg met saus.\n2. Ham en kaas erop.\n3. Bak in oven."},
{id:16,naam:"Tonijn Pizza",cat:"Hoofdgerecht",keuken:"Italiaans",tijd:40,pers:4,ster:0,status:"⏳ Nog proberen",foto:"🍕",ing:["Pizzadeeg","Tomatensaus","Kaas","Tonijn","Ui"],gerei:["Oven","Bakplaat"],korte:"Pizza met tonijn.",stap:"1. Deeg met saus.\n2. Tonijn en ui verdelen.\n3. Kaas erover en bakken."},

{id:18,naam:"Wraps met kip",cat:"Hoofdgerecht",keuken:"Overig",tijd:25,pers:2,ster:0,status:"⏳ Nog proberen",foto:"🌯",ing:["Wraps","Kipfilet","Sla","Tomaat","Saus","Kruiden"],gerei:["Pan"],korte:"Lichte maaltijd met kip.",stap:"1. Snij kip en bak met kruiden.\n2. Sla en tomaat snijden.\n3. Wrap vullen met alles en oprollen."},

{id:20,naam:"Wraps vegetarisch",cat:"Hoofdgerecht",keuken:"Overig",tijd:25,pers:2,ster:0,status:"⏳ Nog proberen",foto:"🌯",ing:["Wraps","Paprika","Komkommer","Wortel","Sla","Hummus of saus"],gerei:["Pan"],korte:"Vleesvrije wraps met groente.",stap:"1. Groente in reepjes snijden.\n2. Wrap beleggen met saus en groente.\n3. Oprollen en serveren."},
{id:21,naam:"Tonijnsalade",cat:"Bijgerecht",keuken:"Overig",tijd:15,pers:2,ster:0,status:"⏳ Nog proberen",foto:"🥗",ing:["Blik tonijn","Sla","Komkommer","Tomaat","Ui","Mayonaise of dressing"],gerei:["Kom","Lepel"],korte:"Lichte salade met vis.",stap:"1. Groente snijden en mengen.\n2. Tonijn toevoegen.\n3. Dressing naar smaak toevoegen."},
{id:22,naam:"Paprikasalade",cat:"Bijgerecht",keuken:"Overig",tijd:15,pers:2,ster:0,status:"⏳ Nog proberen",foto:"🥗",ing:["Paprika (verschillende kleuren)","Ui","Olijfolie","Azijn","Zout"],gerei:["Kom"],korte:"Kleurrijke frisse salade.",stap:"1. Paprika en ui in dunne reepjes snijden.\n2. Meng olie, azijn en zout tot dressing.\n3. Alles door elkaar mengen."},
{id:23,naam:"Bietensalade",cat:"Bijgerecht",keuken:"Overig",tijd:20,pers:2,ster:0,status:"⏳ Nog proberen",foto:"🥗",ing:["Gekookte bietjes","Ui","Walnoten","Geitenkaas (optioneel)","Dressing"],gerei:["Kom"],korte:"Salade met bieten en noten.",stap:"1. Bietjes in blokjes snijden.\n2. Ui fijnsnijden en samen met walnoten toevoegen.\n3. Dressing naar smaak."},

function laadOp(){const s=localStorage.getItem(OPSLAG);return s?JSON.parse(s):standaard}
function bewaarOp(d){localStorage.setItem(OPSLAG,JSON.stringify(d))}
function wisselFilter(){document.getElementById('filterVak').classList.toggle('aan')}
function maakSterren(aantal){let h='';for(let i=.5;i<=5;i+=.5)h+=i<=aantal?'<span class="aan">★</span>':'<span class="leeg">★</span>';return h||'<span class="leeg">Geen</span>'}
function sluitV(id){document.getElementById(id).classList.remove('aan')}
function loginVenster(){document.getElementById('ww').value='';document.getElementById('loginV').classList.add('aan')}
function controleerWW(){if(document.getElementById('ww').value===WACHTWOORD){beheerder=true;localStorage.setItem('BITES_BEHEER','JA');sluitV('loginV');werkBij()}else alert('❌ Verkeerd wachtwoord!')}
function werkBij(){document.getElementById('toevoegknop').style.display=beheerder?'flex':'none';document.getElementById('beheer').style.display=beheerder?'inline-flex':'none';document.getElementById('beheerknop').innerHTML=beheerder?'🔓':'🔐'}

function toonAlles(){
    const z=document.getElementById('zoek').value.toLowerCase();
    const c=document.getElementById('cat').value;
    const k=document.getElementById('keuken').value;
    const s=document.getElementById('snel').value;
    const st=document.getElementById('status').value;
    const so=document.getElementById('sorteer').value;
    let lijst=laadOp().filter(r=>{
        const alleTekst=`${r.naam} ${r.cat} ${r.keuken} ${(r.ing||[]).join(' ')}`.toLowerCase();
        return (!z||alleTekst.includes(z))&&(!c||r.cat===c)&&(!k||r.keuken===k)&&(!s||(r.tags||'').includes(s))&&(!st||r.status===st)
    });
    lijst.sort((a,b)=>{
        if(so==='tijd-ops')return a.tijd-b.tijd;
        if(so==='tijd-afl')return b.tijd-a.tijd;
        if(so==='ster-afl')return(b.ster||0)-(a.ster||0);
        if(so==='naam')return a.naam.localeCompare(b.naam);
        return 0
    });
    const rooster=document.getElementById('rooster');
    rooster.innerHTML='';
    if(lijst.length===0){rooster.innerHTML=`<div style="grid-column:1/-1;text-align:center;color:var(--grijs);padding:3rem;">🔍 Geen recepten gevonden.</div>`;return}
    lijst.forEach(r=>{
        const kaart=document.createElement('div');
        kaart.className='kaart';
        kaart.onclick=()=>toonRecept(r);
        const kl=r.status.includes('✅')?'status ja':'status nee';
        kaart.innerHTML=`
        <div class="foto">${r.foto}
        <div class="labels"><span class="label">${r.cat}</span><span class="label">${r.keuken}</span></div>
        <div class="status ${kl}">${r.status}</div>
        </div>
        <div class="inhoud">
        <h4 class="titel">${r.naam}</h4>
        <div class="ster">${maakSterren(r.ster||0)}</div>
        <p class="beschrijving">${r.korte}</p>
        ${r.gerei&&r.gerei.length?`<div class="gerei">🍳 ${r.gerei.join(', ')}</div>`:''}
        <div class="info"><span>⏱️ ${r.tijd} min</span><span>👥 ${r.pers} pers</span></div>
        </div>`;
        rooster.appendChild(kaart)
    })
}

function toonRecept(r){
    document.getElementById('detailTitel').innerText=r.naam;
    const ingLijst=(r.ing||[]).map(i=>`• ${i}`).join('<br>');
    document.getElementById('detailInhoud').innerHTML=`
    <div style="display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:1rem;">
    <div style="width:80px;height:80px;background:rgba(10,18,40,.7);border-radius:12px;border:1px solid rgba(0,255,157,.2);display:flex;align-items:center;justify-content:center;font-size:2.5rem;">${r.foto}</div>
    <div>
    <p><strong style="color:var(--groen)">Categorie:</strong> ${r.cat}</p>
    <p><strong style="color:var(--groen)">Keuken:</strong> ${r.keuken}</p>
    <p><strong style="color:var(--groen)">Tijd:</strong> ${r.tijd} min</p>
    <p><strong style="color:var(--groen)">Personen:</strong> ${r.pers}</p>
    <p><strong style="color:var(--goud)">Sterren:</strong> ${maakSterren(r.ster||0)}</p>
    </div>
    </div>
    <div style="margin-bottom:.8rem;">
    <h4 style="color:var(--groen);margin-bottom:.3rem;">Ingrediënten</h4>
    <p style="color:var(--grijs);line-height:1.7;">${ingLijst||'Geen'}</p>
    </div>
    <div style="margin-bottom:.8rem;">
    <h4 style="color:var(--groen);margin-bottom:.3rem;">Benodigdheden</h4>
    <p style="color:var(--grijs);">${(r.gerei||[]).join(', ')||'Geen'}</p>
    </div>
    <div>
    <h4 style="color:var(--groen);margin-bottom:.3rem;">Bereiding</h4>
    <p style="color:var(--grijs);white-space:pre-line;line-height:1.7;">${r.stap||'Geen beschrijving'}</p>
    </div>`;
    document.getElementById('detailV').classList.add('aan')
}
