<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>🌌 BITES - Recepten</title>
    <link rel="stylesheet" href="stijl.css">
</head>
<body>
<div class="container">
    <header>
        <div class="logo">🌌 BITES</div>
        <div class="acties">
            <button class="btn sec" onclick="openVenster('notitieV')">📝 Notities</button>
            <button class="btn sec" id="beheerKnop" onclick="loginVenster()">🔐</button>
            <button class="btn sec" id="favKnop" onclick="wisselFav()">⭐ Favorieten</button>
            <button class="btn sec" id="weergaveKnop" onclick="wisselWeergave()">📋 Lijst</button>
            <button class="btn prim" id="toevoegKnop" onclick="openForm()" style="display:none">➕ Recept</button>
        </div>
    </header>

    <main class="hoofd-inhoud">
        <div class="zoek-balk">
            <input type="text" id="zoek" placeholder="🔍 Zoek op naam, ingrediënt..." oninput="toonAlles()">
            <button class="btn" onclick="wisselFilter()">⚙️ Filters</button>
        </div>

        <div id="filterVak" class="filter-uitklap">
            <select id="cat" onchange="toonAlles()">
                <option value="">Alle Categorieën</option>
                <option>Voorgerecht</option>
                <option>Hoofdgerecht</option>
                <option>Bijgerecht</option>
                <option>Nagerecht</option>
                <option>Pasta & Rijst</option>
                <option>Vleesgerecht</option>
                <option>Visgerecht</option>
            </select>
            <select id="keuken" onchange="toonAlles()">
                <option value="">Alle Keukens</option>
                <option>Italiaans</option>
                <option>Mexicaans</option>
                <option>Spaans</option>
                <option>Aziatisch</option>
                <option>Nederlands</option>
                <option>Overig</option>
            </select>
            <select id="sorteer" onchange="toonAlles()">
                <option value="tijd-ops">⏱️ Tijd: Kort → Lang</option>
                <option value="tijd-afl">⏱️ Tijd: Lang → Kort</option>
                <option value="ster-afl">⭐ Beoordeling</option>
                <option value="naam">📫 Naam A-Z</option>
            </select>
        </div>

        <div id="rooster" class="rooster"></div>
    </main>
</div>

<!-- Notitie Venster -->
<div id="notitieV" class="venster">
    <div class="venster-inhoud">
        <div class="venster-kop"><h3>📝 Notities</h3><button class="sluit" onclick="sluitVenster('notitieV')">&times;</button></div>
        <div class="venster-body">
            <textarea id="notitieVak" placeholder="Schrijf hier snelle notities...&#10;Bijv: wat nog toevoegen, boodschappen, ideeën..."></textarea>
            <div class="knop-rij">
                <button class="btn prim" onclick="sluitVenster('notitieV')">✅ Opslaan & Sluiten</button>
            </div>
        </div>
    </div>
</div>

<!-- Inlogvenster -->
<div id="loginV" class="venster">
    <div class="venster-inhoud">
        <div class="venster-kop"><h3>🔐 Inloggen</h3><button class="sluit" onclick="sluitVenster('loginV')">&times;</button></div>
        <div class="venster-body">
            <label>Wachtwoord</label>
            <input type="password" id="ww">
            <div class="knop-rij">
                <button class="btn prim" onclick="controleerWW()">Inloggen</button>
                <button class="btn sec" onclick="sluitVenster('loginV')">Annuleren</button>
            </div>
        </div>
    </div>
</div>

<!-- Recept Toevoegen/Bewerken -->
<div id="formV" class="venster">
    <div class="venster-inhoud">
        <div class="venster-kop"><h3 id="formTitel">➕ Nieuw Recept</h3><button class="sluit" onclick="sluitVenster('formV')">&times;</button></div>
        <div class="venster-body">
            <input type="hidden" id="bewerkId">
            <label>Naam *</label><input type="text" id="f-naam">
            <label>Categorie</label>
            <select id="f-cat">
                <option>Voorgerecht</option>
                <option selected>Hoofdgerecht</option>
                <option>Bijgerecht</option>
                <option>Nagerecht</option>
                <option>Pasta & Rijst</option>
                <option>Vleesgerecht</option>
                <option>Visgerecht</option>
            </select>
            <label>Keuken</label>
            <select id="f-keuken">
                <option>Italiaans</option>
                <option>Mexicaans</option>
                <option>Spaans</option>
                <option>Aziatisch</option>
                <option>Nederlands</option>
                <option selected>Overig</option>
            </select>
            <label>Bereidingstijd (min)</label><input type="number" id="f-tijd" value="25">
            <label>Aantal personen</label><input type="number" id="f-pers" value="2">
            <label>Beoordeling (1-5)</label>
            <div class="sterren" id="f-ster">
                <span data-waarde="1">★</span>
                <span data-waarde="2">★</span>
                <span data-waarde="3">★</span>
                <span data-waarde="4">★</span>
                <span data-waarde="5">★</span>
            </div>
            <label>Foto / Emoji</label><input type="text" id="f-foto" value="🍽️">
            <label>Ingrediënten</label><textarea id="f-ing" placeholder="Elk op nieuwe regel"></textarea>
            <label>Benodigdheden</label><textarea id="f-gerei"></textarea>
            <label>Korte beschrijving</label><textarea id="f-korte"></textarea>
            <label>Bereidingswijze</label><textarea id="f-stap"></textarea>
            <div class="knop-rij">
                <button class="btn sec" onclick="sluitVenster('formV')">Annuleren</button>
                <button class="btn prim" onclick="bewaarRecept()">✅ Opslaan</button>
                <button class="btn rood" id="verwijderKnop" style="display:none" onclick="verwijderRecept()">🗑️ Verwijder</button>
            </div>
        </div>
    </div>
</div>

<!-- Recept Detail Venster -->
<div id="detailV" class="venster">
    <div class="venster-inhoud">
        <div class="venster-kop"><h3 id="detailNaam"></h3><button class="sluit" onclick="sluitVenster('detailV')">&times;</button></div>
        <div class="venster-body" id="detailInhoud"></div>
    </div>
</div>

<script src="werkingen.js"></script>
</body>
</html>
