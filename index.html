<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bites - Recepten Website</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-hover: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #10b981;
            --accent-hover: #059669;
            --danger: #ef4444;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: Helvetica, Arial, sans-serif;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        .app-container {
            width: min(98vw, 1200px);
            min-height: 100vh;
            margin: 0 auto;
            background: var(--card-bg);
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        header {
            padding: clamp(0.8rem, 2vw, 1.2rem) clamp(1rem, 3vw, 1.5rem);
            background: #0f172a;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
        }

        .logo img {
            height: 40px;
            width: auto;
            display: block;
        }

        .header-actions {
            display: flex;
            gap: 0.6rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.5rem 0.9rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s, transform 0.1s;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .btn:hover { background: var(--accent-hover); }
        .btn:active { transform: scale(0.97); }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
        }
        .btn-secondary:hover { background: var(--card-hover); }

        .btn-danger { background: var(--danger); }

        .controls-bar {
            padding: 1rem clamp(1rem, 3vw, 1.5rem);
            background: rgba(15, 23, 42, 0.5);
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            border-bottom: 1px solid var(--border);
        }

        .search-row { display: flex; gap: 0.75rem; flex-wrap: wrap; }

        .search-input, .filter-select {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.7rem 1rem;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            width: 100%;
        }

        .search-input:focus, .filter-select:focus { border-color: var(--accent); }

        .collapsible-controls {
            display: none;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 0.75rem;
            margin-top: 0.5rem;
            animation: fadeIn 0.2s ease-in-out;
        }

        .collapsible-controls.show { display: grid; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .content-area {
            flex: 1;
            padding: 1rem clamp(1rem, 3vw, 1.5rem);
        }

        .recipe-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.2rem;
        }

        .recipe-card {
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .recipe-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px -5px rgba(16, 185, 129, 0.15);
            border-color: var(--accent);
        }

        .recipe-image {
            height: 140px;
            background: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            position: relative;
            overflow: hidden;
        }

        .recipe-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .recipe-tags {
            position: absolute;
            top: 6px;
            left: 6px;
            display: flex;
            gap: 0.3rem;
            flex-wrap: wrap;
        }

        .tag {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(4px);
            padding: 0.2rem 0.45rem;
            border-radius: 4px;
            font-size: 0.7rem;
            color: var(--accent);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .recipe-info {
            padding: 0.9rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            flex: 1;
        }

        .recipe-title {
            font-size: 1rem;
            font-weight: bold;
            margin: 0;
            color: var(--text-main);
        }

        .recipe-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin: 0;
            line-height: 1.4;
        }

        .recipe-tools {
            background: rgba(16, 185, 129, 0.08);
            padding: 0.45rem 0.6rem;
            border-radius: 6px;
            font-size: 0.78rem;
            color: var(--accent);
            margin-top: 0.2rem;
            line-height: 1.4;
        }

        .recipe-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.6rem;
            padding-top: 0.6rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 1rem;
            box-sizing: border-box;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border);
            width: min(100%, 550px);
            max-height: 90vh;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }

        .modal-header {
            padding: 1rem 1.25rem;
            background: #0f172a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .modal-header h3 {
            font-size: 1.1rem;
            margin: 0;
        }

        .modal-body {
            padding: 1.25rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .form-group label {
            font-size: 0.88rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .form-control {
            background: #0f172a;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.7rem;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            width: 100%;
        }

        .form-control:focus { border-color: var(--accent); }
        textarea.form-control { resize: vertical; min-height: 80px; }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            line-height: 1;
        }
        .close-btn:hover { color: var(--text-main); }

        .preview-box {
            width: 80px;
            height: 80px;
            background: #0f172a;
            border: 1px dashed var(--border);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            overflow: hidden;
            margin-top: 0.25rem;
        }
        .preview-box img { width: 100%; height: 100%; object-fit: cover; }

        .admin-indicator {
            font-size: 0.75rem;
            color: var(--accent);
            background: rgba(16, 185, 129, 0.1);
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
        }

        .sync-badge {
            font-size: 0.75rem;
            color: var(--accent);
            background: rgba(16, 185, 129, 0.1);
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .button-row {
            display: flex;
            gap: 0.75rem;
            margin-top: 0.5rem;
        }

        .button-row .btn {
            flex: 1;
            justify-content: center;
        }

        @media (max-width: 600px) {
            .form-row { grid-template-columns: 1fr; }
            .recipe-grid { grid-template-columns: 1fr; gap: 1rem; }
            .search-row { flex-direction: column; }
            .header-actions { gap: 0.4rem; }
            .btn { padding: 0.45rem 0.7rem; font-size: 0.85rem; }
            .logo img { height: 32px; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <div class="logo">
                <img src="logo.png" alt="Bites">
            </div>
            <div class="header-actions">
                <span class="sync-badge">💾 Lokaal</span>
                <span id="adminIndicator" class="admin-indicator" style="display:none;">🔐 Beheerder</span>
                <button class="btn btn-secondary" id="adminBtn" onclick="openAdminLogin()">🔐</button>
                <button class="btn" id="addBtn" onclick="openRecipeFormModal()" style="display:none;">➕ Toevoegen</button>
            </div>
        </header>

        <div class="controls-bar">
            <div class="search-row">
                <input type="text" id="searchInput" class="search-input" placeholder="🔍 Zoek op naam of ingrediënt..." oninput="filterAndRender()">
                <button class="btn btn-secondary" onclick="toggleSortAndFilters()" id="toggleSortBtn">⚙️ Filter</button>
            </div>
            <div id="collapsibleControls" class="collapsible-controls">
                <select id="cuisineFilter" class="filter-select" onchange="filterAndRender()">
                    <option value="">Alle Keukens</option>
                    <option value="Italian">Italiaans</option>
                    <option value="Mexican">Mexicaans</option>
                    <option value="Dutch">Nederlands</option>
                    <option value="Asian">Aziatisch</option>
                    <option value="French">Frans</option>
                    <option value="Spanish">Spaans</option>
                    <option value="Greek">Grieks</option>
                    <option value="Turkish">Turks</option>
                </select>
                <select id="dishFilter" class="filter-select" onchange="filterAndRender()">
                    <option value="">Alle Soorten</option>
                    <option value="Main">Hoofdgerecht</option>
                    <option value="Appetizer">Voorgerecht</option>
                    <option value="Dessert">Dessert</option>
                    <option value="Soup">Soep</option>
                    <option value="Breakfast">Ontbijt</option>
                    <option value="Lunch">Lunch</option>
                </select>
                <select id="sortFilter" class="filter-select" onchange="filterAndRender()">
                    <option value="asc">⏱️ Tijd: Kort naar Lang</option>
                    <option value="desc">⏱️ Tijd: Lang naar Kort</option>
                </select>
            </div>
        </div>

        <div class="content-area">
            <div id="recipeGrid" class="recipe-grid"></div>
        </div>
    </div>

    <!-- Inlogscherm -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>🔐 Beheerder Inloggen</h3>
                <button class="close-btn" onclick="closeModal('loginModal')">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Wachtwoord</label>
                    <input type="password" id="adminPassword" class="form-control" placeholder="Voer wachtwoord in...">
                </div>
                <div class="button-row">
                    <button class="btn" onclick="checkAdminLogin()">Inloggen</button>
                    <button class="btn btn-secondary" onclick="closeModal('loginModal')">Annuleren</button>
                </div>
                <p style="font-size:0.8rem; color:var(--text-muted); margin-top:1rem;">
                    💡 Standaard wachtwoord: <strong>greenbite2026</strong>
                </p>
            </div>
        </div>
    </div>

    <!-- Recept Toevoegen/Bewerken -->
    <div id="recipeFormModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="formModalTitle">➕ Nieuw Recept</h3>
                <button class="close-btn" onclick="closeModal('recipeFormModal')">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editRecipeId" value="">
                <div class="form-group">
                    <label>Naam Recept *</label>
                    <input type="text" id="formName" class="form-control" placeholder="bv. Pasta Bolognese">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Keuken</label>
                        <select id="formCuisine" class="form-control">
                            <option value="Italian">Italiaans</option>
                            <option value="Mexican">Mexicaans</option>
                            <option value="Dutch">Nederlands</option>
                            <option value="Asian">Aziatisch</option>
                            <option value="French">Frans</option>
                            <option value="Spanish">Spaans</option>
                            <option value="Greek">Grieks</option>
                            <option value="Turkish">Turks</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Soort</label>
                        <select id="formDishType" class="form-control">
                            <option value="Main">Hoofdgerecht</option>
                            <option value="Appetizer">Voorgerecht</option>
                            <option value="Dessert">Dessert</option>
                            <option value="Soup">Soep</option>
                            <option value="Breakfast">Ontbijt</option>
                            <option value="Lunch">Lunch</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Bereidingstijd (min)</label>
                        <input type="number" id="formTime" class="form-control" value="25">
                    </div>
                    <div class="form-group">
                        <label>Foto (emoji of link)</label>
                        <input type="text" id="formPhoto" class="form-control" placeholder="bv. 🍕" value="🍽️" oninput="updateImagePreview(this.value)">
                    </div>
                </div>
                <div class="form-group">
                    <label>Voorbeeld</label>
                    <div id="imagePreviewBox" class="preview-box">🍽️</div>
                </div>
                <div class="form-group">
                    <label>Ingrediënten *</label>
                    <div id="ingredientsContainer" style="display: flex; flex-direction: column; gap: 0.5rem;"></div>
                    <button type="button" class="btn btn-secondary" style="font-size:0.85rem; padding:0.4rem 0.8rem; margin-top:0.3rem;" onclick="addIngredientRow()">➕ Toevoegen</button>
                </div>
                <div class="form-group">
                    <label>Benodigdheden / Gereedschap *</label>
                    <input type="text" id="formTools" class="form-control" placeholder="Pan, Mes, Oven...">
                </div>
                <div class="form-group">
                    <label>Korte Beschrijving</label>
                    <input type="text" id="formDescription" class="form-control" placeholder="Korte samenvatting...">
                </div>
                <div class="form-group">
                    <label>Bereidingswijze</label>
                    <textarea id="formInstructions" class="form-control" placeholder="Stap voor stap..."></textarea>
                </div>
                <div class="button-row">
                    <button class="btn" onclick="saveRecipeFromForm()">✅ Opslaan</button>
                    <button class="btn btn-secondary" onclick="closeModal('recipeFormModal')">Annuleren</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Recept Detail -->
    <div id="recipeModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Recept</h3>
                <button class="close-btn" onclick="closeModal('recipeModal')">&times;</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = 'greenbite2026';
        const APP_STORAGE_KEY = 'BITES_RECIPES_V1';
        let isAdmin = localStorage.getItem('bites_admin') === 'true';

        const defaultRecipes = [
            {
                id: 1,
                name: "Pasta Bolognese",
                cuisine: "Italian",
                dishType: "Main",
                time: 30,
                photo: "🍝",
                ingredients: ["Pasta", "Gehakt", "Tomaat", "Ui", "Knoflook"],
                tools: ["Pan", "Kookpan", "Mes", "Snijplank"],
                description: "Een klassieke pasta met gehaktsaus.",
                instructions: "1. Kook de pasta.\n2. Fruit ui en knoflook.\n3. Voeg gehakt toe en bak rul.\n4. Voeg tomaten toe en laat pruttelen.\n5. Meng met de pasta."
            },
            {
                id: 2,
                name: "Taco's",
                cuisine: "Mexican",
                dishType: "Main",
                time: 20,
                photo: "🌮",
                ingredients: ["Tortilla's", "Gehakt", "Sla", "Kaas", "Saus"],
                tools: ["Koekenpan", "Lepel"],
                description: "Snelle en lekkere taco's.",
                instructions: "1. Bak het gehakt met kruiden.\n2. Warm de tortilla's.\n3. Vul en werk af met sla en kaas."
            }
        ];

        function loadData() {
            const saved = localStorage.getItem(APP_STORAGE_KEY + '_data');
            if (!saved) {
                localStorage.setItem(APP_STORAGE_KEY + '_data', JSON.stringify(defaultRecipes));
                return defaultRecipes;
            }
            try { return JSON.parse(saved); }
            catch (e) { return defaultRecipes; }
        }

        function saveData(data) {
            localStorage.setItem(APP_STORAGE_KEY + '_data', JSON.stringify(data));
        }

        function openAdminLogin() {
            if (isAdmin) {
                isAdmin = false;
                localStorage.removeItem('bites_admin');
                updateAdminUI();
            } else {
                document.getElementById('adminPassword').value = '';
                document.getElementById('loginModal').style.display = 'flex';
            }
        }

        function checkAdminLogin() {
            const pw = document.getElementById('adminPassword').value;
            if (pw === ADMIN_PASSWORD) {
                isAdmin = true;
                localStorage.setItem('bites_admin', 'true');
                closeModal('loginModal');
                updateAdminUI();
                filterAndRender();
            } else {
                alert('❌ Verkeerd wachtwoord!');
            }
        }

        function updateAdminUI() {
            document.getElementById('addBtn').style.display = isAdmin ? 'flex' : 'none';
            document.getElementById('adminIndicator').style.display = isAdmin ? 'inline-flex' : 'none';
            document.getElementById('adminBtn').innerHTML = isAdmin ? '🔓' : '🔐';
        }

        function toggleSortAndFilters() {
            document.getElementById('collapsibleControls').classList.toggle('show');
        }

        function filterAndRender() {
            const recipes = loadData();
            const search = document.getElementById('searchInput').value.toLowerCase();
            const cuisine = document.getElementById('cuisineFilter').value;
            const dish = document.getElementById('dishFilter').value;
            const sort = document.getElementById('sortFilter').value;

            let filtered = recipes.filter(r => {
                const matchSearch = r.name.toLowerCase().includes(search) || 
                    r.ingredients.some(i => i.toLowerCase().includes(search));
                const matchCuisine = !cuisine || r.cuisine === cuisine;
                const matchDish = !dish || r.dishType === dish;
                return matchSearch && matchCuisine && matchDish;
            });

            filtered.sort((a, b) => sort === 'asc' ? a.time - b.time : b.time - a.time);
            renderGrid(filtered);
        }

        function renderGrid(recipes) {
            const grid = document.getElementById('recipeGrid');
            grid.innerHTML = '';

            if (recipes.length === 0) {
                grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:var(--text-muted); padding:3rem;">
                    🔍 Geen recepten gevonden.<br>
                    ${isAdmin ? `<button class="btn" onclick="openRecipeFormModal()" style="margin-top:1rem;">➕ Voeg je eerste recept toe</button>` : ''}
                </div>`;
                return;
            }

            recipes.forEach(r => {
                const card = document.createElement('div');
                card.className = 'recipe-card';
                card.onclick = () => openRecipeDetail(r);
                const isImgUrl = r.photo && (r.photo.startsWith('http') || r.photo.startsWith('data:'));

                card.innerHTML = `
                    <div class="recipe-image">
                        ${isImgUrl ? `<img src="${r.photo}" alt="${r.name}">` : (r.photo || '🍽️')}
                        <div class="recipe-tags">
                            <span class="tag">${r.cuisine}</span>
                            <span class="tag">${r.dishType}</span>
                        </div>
                    </div>
                    <div class="recipe-info">
                        <h4 class="recipe-title">${r.name}</h4>
                        <p class="recipe-desc">${r.description}</p>
                        <div class="recipe-tools">🍳 ${Array.isArray(r.tools) ? r.tools.join(', ') : r.tools}</div>
                        <div class="recipe-meta">
                            <span>⏱️ ${r.time} min</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function updateImagePreview(val) {
            const box = document.getElementById('imagePreviewBox');
            if (val.startsWith('http') || val.startsWith('data:')) {
                box.innerHTML = `<img src="${val}" alt="Voorbeeld">`;
            } else {
                box.innerHTML = val || '🍽️';
            }
        }

        function addIngredientRow(val = '') {
            const container = document.getElementById('ingredientsContainer');
            const row = document.createElement('div');
            row.style.display = 'flex';
            row.style.gap = '0.5rem';
            row.style.alignItems = 'center';
            row.innerHTML = `
                <input type="text" class="form-control ingredient-input" value="${val}" placeholder="bv. 200g pasta" style="flex:1;">
                ${isAdmin ? `<button class="btn btn-danger" style="padding:0.5rem 0.75rem;" onclick="this.parentElement.remove()">❌</button>` : ''}
            `;
            container.appendChild(row);
        }

        function openRecipeFormModal(recipeId = null) {
            if (!isAdmin) { alert('🔐 Log eerst in als beheerder!'); return; }
            
            document.getElementById('editRecipeId').value = recipeId || '';
            const ingredientsContainer = document.getElementById('ingredientsContainer');
            ingredientsContainer.innerHTML = '';

            if (recipeId) {
                document.getElementById('formModalTitle').innerText = '✏️ Bewerk Recept';
                const recipes = loadData();
                const r = recipes.find(item => item.id === recipeId);
                if (r) {
                    document.getElementById('formName').value = r.name;
                    document.getElementById('formCuisine').value = r.cuisine;
                    document.getElementById('formDishType').value = r.dishType;
                    document.getElementById('formTime').value = r.time;
                    document.getElementById('formPhoto').value = r.photo;
                    r.ingredients.forEach(ing => addIngredientRow(ing));
                    document.getElementById('formTools').value = Array.isArray(r.tools) ? r.tools.join(', ') : r.tools;
                    document.getElementById('formDescription').value = r.description;
                    document.getElementById('formInstructions').value = r.instructions;
                    updateImagePreview(r.photo);
                }
            } else {
                document.getElementById('formModalTitle').innerText = '➕ Nieuw Recept';
                document.getElementById('formName').value = '';
                document.getElementById('formCuisine').value = 'Italian';
                document.getElementById('formDishType').value = 'Main';
                document.getElementById('formTime').value = 25;
                document.getElementById('formPhoto').value = '🍽️';
                addIngredientRow('');
                addIngredientRow('');
                document.getElementById('formTools').value = '';
                document.getElementById('formDescription').value = '';
                document.getElementById('formInstructions').value = '';
                updateImagePreview('🍽️');
            }

            document.getElementById('recipeFormModal').style.display = 'flex';
        }

        function saveRecipeFromForm() {
            const editId = document.getElementById('editRecipeId').value;
            const name = document.getElementById('formName').value.trim();
            const cuisine = document.getElementById('formCuisine').value;
            const dishType = document.getElementById('formDishType').value;
            const time = parseInt(document.getElementById('formTime').value) || 20;
            const photo = document.getElementById('formPhoto').value.trim() || '🍽️';
            
            const ingredientInputs = document.querySelectorAll('.ingredient-input');
            const ingredients = Array.from(ingredientInputs).map(i => i.value.trim()).filter(s => s);
            const tools = document.getElementById('formTools').value.split(',').map(s => s.trim()).filter(s => s);
            const description = document.getElementById('formDescription').value.trim() || 'Zelfgemaakt recept.';
            const instructions = document.getElementById('formInstructions').value.trim();

            if (!name) { alert('⚠️ Vul een naam in!'); return; }
            if (ingredients.length === 0) { alert('⚠️ Voeg ten minste één ingrediënt toe!'); return; }
            if (tools.length === 0) { alert('⚠️ Vul benodigdheden in!'); return; }

            const recipes = loadData();

            if (editId) {
                const index = recipes.findIndex(item => item.id == editId);
                if (index !== -1) {
                    recipes[index] = { id: parseInt(editId), name, cuisine, dishType, time, photo, ingredients, tools, description, instructions };
                }
            } else {
                recipes.push({ id: Date.now(), name, cuisine, dishType, time, photo, ingredients, tools, description, instructions });
            }

            saveData(recipes);
            closeModal('recipeFormModal');
            filterAndRender();
            alert('✅ Recept opgeslagen!');
        }

        function openRecipeDetail(r) {
            document.getElementById('modalTitle').innerText = r.name;
            const body = document.getElementById('modalBody');
            
            const ingredientsList = r.ingredients.map(i => `<li>${i}</li>`).join('');
            const toolsList = Array.isArray(r.tools) ? r.tools.join(', ') : r.tools;
            const isImgUrl = r.photo && (r.photo.startsWith('http') || r.photo.startsWith('data:'));

            body.innerHTML = `
                <div style="display:flex; gap:1rem; align-items:center; flex-wrap:wrap; margin-bottom:1rem;">
                    <div style="width:90px; height:90px; background:#0f172a; border-radius:12px; border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:3rem; overflow:hidden; flex-shrink:0;">
                        ${isImgUrl ? `<img src="${r.photo}" style="width:100%; height:100%; object-fit:cover;">` : r.photo}
                    </div>
                    <div style="flex:1; min-width:180px;">
                        <p style="margin:0 0 0.3rem 0;"><strong>Keuken:</strong> ${r.cuisine}</p>
                        <p style="margin:0 0 0.3rem 0;"><strong>Soort:</strong> ${r.dishType}</p>
                        <p style="margin:0 0 0.3rem 0;"><strong>Tijd:</strong> ${r.time} min</p>
                        <p style="margin:0;"><strong>Benodigdheden:</strong> ${toolsList}</p>
                    </div>
                </div>
                <div style="margin-bottom:1rem;">
                    <h4 style="margin:0 0 0.4rem 0; color:var(--accent);">Ingrediënten</h4>
                    <ul style="margin:0; padding-left:1.2rem; color:var(--text-muted);">${ingredientsList}</ul>
                </div>
                <div>
                    <h4 style="margin:0 0 0.4rem 0; color:var(--accent);">Bereidingswijze</h4>
                    <p style="margin:0; color:var(--text-muted); white-space:pre-line;">${r.instructions}</p>
                </div>
                ${isAdmin ? `
                <div style="display:flex; gap:0.75rem; margin-top:1rem; border-top:1px solid var(--border); padding-top:1rem;">
                    <button class="btn btn-secondary" style="flex:1; justify-content:center;" onclick="closeModal('recipeModal'); openRecipeFormModal(${r.id})">✏️ Bewerken</button>
                    <button class="btn btn-danger" style="flex:1; justify-content:center;" onclick="deleteRecipe(${r.id})">🗑️ Verwijderen</button>
                </div>` : ''}
            `;
            document.getElementById('recipeModal').style.display = 'flex';
        }

        function deleteRecipe(id) {
            if (!confirm('Weet je zeker dat je dit recept wilt verwijderen?')) return;
            let recipes = loadData();
            recipes = recipes.filter(r => r.id !== id);
            saveData(recipes);
            closeModal('recipeModal');
            filterAndRender();
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        updateAdminUI();
        filterAndRender();
    </script>
</body>
</html>
